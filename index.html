<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>مطعم ست البيت</title>
<style>
  .bas{background:#222; color:white; padding:15px; position:sticky; top:0; display:flex; justify-content:space-between;}
  .option{border:1px solid #ddd; padding:10px; margin:10px; display:inline-block; width:160px; text-align:center;}
  .add{background:green; color:white; padding:8px; border:none; cursor:pointer; width:100%;}
  .wats{background:#25D366; color:white; padding:10px; border:none; cursor:pointer;}
  #cart-box{background:#f1f1f1; padding:15px; margin:10px; border:2px solid green; display:none;}
</style>
</head>
<body>

<div class="bas">
  <div>السلة: <span id="cart-count">0</span> | الاجمالي: <span id="cart-total">0</span>$</div>
  <button onclick="showCart()">عرض السلة</button>
</div>

<div id="cart-box">
  <h3>طلباتك</h3>
  <div id="cart-items"></div>
  <h3 id="final-total"></h3>
  <button class="wats" onclick="sendOrder()">اطلب على الواتساب</button>
  <button onclick="clearCart()">فضي السلة</button>
</div>

<div class="options">
  <div class="option"><img src="f1.jpg" width="100"><h2>food1<h3>10$</h3></h2><button class="add" onclick="addToCart('food1',10)">اضف للسلة</button></div>
  <div class="option"><img src="f1.jpg" width="100"><h2>food2<h3>15$</h3></h2><button class="add" onclick="addToCart('food2',15)">اضف للسلة</button></div>
  <div class="option"><img src="f1.jpg" width="100"><h2>food3<h3>20$</h3></h2><button class="add" onclick="addToCart('food3',20)">اضف للسلة</button></div>
  <div class="option"><img src="f1.jpg" width="100"><h2>food4<h3>25$</h3></h2><button class="add" onclick="addToCart('food4',25)">اضف للسلة</button></div>
</div>

<script>
let cart=JSON.parse(localStorage.getItem("myCart"))||[];
function addToCart(name,price){
  let found=cart.find(i=>i.name===name);
  if(found){found.qty+=1;}else{cart.push({name:name,price:price,qty:1});}
  saveAndRender();
}
function saveAndRender(){
  localStorage.setItem("myCart",JSON.stringify(cart));
  let c=0,t=0;
  cart.forEach(i=>{c+=i.qty; t+=i.price*i.qty;});
  document.getElementById('cart-count').innerText=c;
  document.getElementById('cart-total').innerText=t;
  renderCartItems();
}
function renderCartItems(){
  let box=document.getElementById('cart-items');
  box.innerHTML="";
  let total=0;
  cart.forEach((item,index)=>{
    let sub=item.price*item.qty;
    total+=sub;
    box.innerHTML+=`<div>${item.name} x${item.qty} = ${sub}$ <button onclick="removeItem(${index})">حذف</button></div>`;
  });
  document.getElementById('final-total').innerText="الاجمالي = "+total+"$";
}
function removeItem(i){cart.splice(i,1); saveAndRender();}
function clearCart(){cart=[]; saveAndRender(); document.getElementById('cart-box').style.display="none";}
function showCart(){
  if(cart.length===0){alert("السلة فاضية");return;}
  document.getElementById('cart-box').style.display="block";
}
function sendOrder(){
  if(cart.length===0){alert("السلة فاضية");return;}
  let msg="طلب جديد:\n"; let total=0;
  cart.forEach(i=>{msg+=`- ${i.name} x${i.qty} = ${i.price*i.qty}$\n`; total+=i.price*i.qty;});
  msg+=`الاجمالي = ${total}$`;
  let link=`https://wa.me/201065667221?text=${encodeURIComponent(msg)}`;
  window.open(link,'_blank');
  clearCart();
}
saveAndRender();
</script>
</body>
</html>
